# ==============================================================
# Spectra 專案設定 — openspec/config.yaml
# 負責「AI 產生 artifact 時的背景與規則」。
# 行為開關（locale / tdd / parallel_tasks / worktree…）在 .spectra.yaml，不在這裡。
# 另有「全域」設定在 ~/Library/Application Support/openspec/，由 `spectra config` 指令管，跨專案。
# ==============================================================

# ── schema：使用哪套工作流程 ──────────────────────────────────
# 決定產哪些 artifact 及順序。目前只有 spec-driven（proposal → specs → design → tasks）。
schema: spec-driven

# ── context：專案背景（每次產 artifact 都會餵給 AI）──────────────
# 這是「最高槓桿」的欄位：寫得越完整，AI 越不會猜錯／犯錯。
# 注意：context: | 底下全是「純文字」，會原封不動送給 AI，這裡不能放 # 註解。
context: |
  Tech stack: Swift 6, SwiftUI, SwiftData, Core Bluetooth, AVFoundation (TTS +
  alarm), RevenueCat SDK. No backend, no CloudKit in 1.0.
  Build: xcodegen (project.yml generates the Xcode project)
  Bundle ID: com.shinrenpan.sidebell
  Deployment target: iOS 18.0. Universal app (iPhone + iPad). Development
  verification devices: iPad mini 7 on iOS 27 beta (patient role) and
  iPhone 15 Pro on iOS 26 (caregiver role) — there is no physical device
  running iOS 18–25, so behavior on those versions is unverified. Any device
  checklist must record which OS version the result came from; background
  wake-up and State Restoration results obtained on the beta device must be
  re-verified on a release-version device before being trusted.

  Domain: SideBell (隨身鈴) — an offline BLE call system for bedridden / ALS /
  severely disabled patients and their caregivers. One app, two roles selected
  at first launch: patient = BLE peripheral (advertises, sends calls), caregiver
  = BLE central (background scan, alarm, ack). 100% internet-free. Eye control is
  NOT implemented in-app; the app only provides an eye-control-friendly UI
  (huge buttons, high contrast, wide spacing) driven by iOS system-level Eye
  Tracking + Dwell Control. Built for RevenueCat Shipaton 2026 (Peace Prize):
  App Review submission 2026/9/5, release 2026/9/15.

  Requirements source: `SideBell_Spec_v0.5.md` at the repo root is the single
  source of truth for product requirements. Its section 1.1 exclusion list is
  final and closed — Multipeer Connectivity, custom eye tracking, in-app dwell
  timing, subscriptions, purchase gating, silent-audio background keepalive,
  NEAppPushProvider. Never re-propose any of them.

  Project decisions:
  Entry point is AppDelegate + SceneDelegate (UIKit lifecycle) hosting SwiftUI
  via UIHostingController, NOT a SwiftUI @main App — Core Bluetooth State
  Restoration requires rebuilding the managers early in
  application(_:didFinishLaunchingWithOptions:).
  Core logic must never depend on Core Bluetooth directly: everything goes
  through a `CallTransport` protocol (send / receive / ack / connectionState);
  the only 1.0 implementation is BLETransport. This slot exists so 1.1 can add a
  CloudKit push transport without touching call/alarm logic.
  All identifiers, file names, comments and commit messages use SideBell /
  sidebell. No legacy name may appear anywhere.
  Monetization is donation-only: consumable tips via RevenueCat, all features
  permanently free, no entitlement gating anywhere in the app.
  Timeline is the arbiter of scope: when a design option threatens the 9/15
  release, pick the simpler one; if it is genuinely unclear, stop and ask.
  Pending calls awaiting ack live only in memory and are never persisted — a
  call revived after an app restart is a false alarm, not a late message.
  Multi-patient (one central to many peripherals) is structurally allowed —
  BLETransport manages connections as a collection — but 1.0 UI shows exactly
  one patient.
  The caregiver role enables the `audio` background mode so urgent alarms can
  repeat beyond the ~10s BLE wake window. Two disciplines apply: the audio
  session must be deactivated when not alarming, and repeat alarms must have a
  hard stop. This is real alarm playback, not the silent-audio keepalive that
  section 1.1 rejected.

  Accessibility policy: VoiceOver, Switch Control and Dynamic Type support are
  implemented alongside each screen, never deferred to a later polish phase.
  Every change's acceptance criteria must include VoiceOver operability of the
  screens it touches. The target population includes blind users: sighted-but-
  immobile users rely on eye control, blind-but-mobile users on VoiceOver, and
  blind-and-immobile users on Switch Control with audible feedback. Feedback
  that exists only in visual form does not exist for part of the audience.

  `DECISIONS.md` at the repo root is the running decision log (date + decision
  + one-line rationale). Append new decisions there; never edit
  `SideBell_Spec_v0.5.md`.

  Testing policy: test-first applies to pure logic — the binary wire format
  codec (including round-trip and truncated-packet defense), the retry/ack state
  machine, message dedup, and SwiftData model logic. Platform behavior (Core
  Bluetooth background delivery, AVFoundation alarm, RevenueCat purchases) is
  verified with on-device checklists, not mocks; every BLE-touching change must
  ship such a checklist for the developer to run on two physical devices.

  BLE caution: background BLE is the one area of this project where code can
  look correct and still fail in the real world, and public answers about it are
  frequently outdated. State uncertainty explicitly ("this needs device
  verification") instead of asserting confidently.

  Architecture: MVVMC, governed by the user-global mvvmc-* and swift-concurrency
  skills (view / viewmodel / model / hostcontroller / navigation / testing) —
  follow them for all generated code and specs; do not restate or reinvent
  their rules here.

  Solo project (one developer + AI): specs exist for continuity across sessions
  and tools, and as the canonical current design — keep narrative history out
  of specs.

# ── rules：各 artifact 的「硬規則」（每次自動套用）✂️ 整段可攜 ─────
# key 是 artifact 名稱（proposal / design / specs / tasks），value 是規則清單。
# 作用：把慣例變成「每次強制套用」的規則，不靠 AI 自覺。
# 基底採 HerbMeet 實戰版（原 SpecDemo 規則 + backtick 交叉引用），再加 change 切片慣例。
rules:
  proposal:
    # 強制列出範圍界線，避免 propose 範圍模糊、越做越大。
    - Always include a Non-Goals section listing what is explicitly out of scope.
    # change 照畫面切垂直片（MVVMC 直覺）；spec 的 domain/UI 分層不傳染到 change 切法。
    # 抽獨立 domain capability 的門檻：≥2 個畫面消費，或邏輯本來就不屬於任何畫面。
    - Cut every change as a vertical slice by screen/feature (MVVMC: one screen's M+V+VM+C ships together); a single change may touch multiple capability specs. Extract logic into a separate domain capability only when at least two screens consume it, or the rule lives outside any screen (e.g. server-side); otherwise keep it in the screen's capability spec.
    # capability 增減時同步維護索引，防止 capability map 與現實 drift。
    - When a proposal adds or removes a capability, update the capability map at `openspec/specs/README.md` (create the file once the project grows beyond a few capabilities).

  design:
    # 強制寫實作契約，讓 apply（甚至換人／換 AI）有明確可交接的驗收目標。
    - Include an Implementation Contract naming observable behavior and acceptance criteria.
    # 引用其他 capability 一律用 backtick 寫 spec 目錄名，保持 grep 可追蹤
    # （HerbMeet 14 個 capability 交叉引用的實戰教訓）。
    - When referencing another capability's behavior instead of restating it, name that capability's exact spec directory name in backticks (e.g. `user-auth`) so it's grep-discoverable — never a vague reference like "the auth system".

  specs:
    # 每條 requirement 至少一個 WHEN/THEN，確保規格「可被測試」。
    - Every requirement must have at least one WHEN/THEN scenario.
    # 場景描述「可觀察行為」（UI、VM 狀態或 server/API 契約）而非實作細節。
    # 列舉含 server contract 是 HerbMeet 的教訓：domain capability 的場景多是 RPC/DB 行為。
    - Scenarios must describe observable behavior (UI, ViewModel state, or server/API contract), not implementation details.

  tasks:
    # 每個任務都要有驗證目標，杜絕「只寫改哪個檔、不寫怎麼確認完成」的空任務。
    - Each task must state a verification target (test name, CLI command, or manual assertion).
    # 粒度控制：超過 1 小時的任務要拆，維持可追蹤、可交接。
    - Split any task that would take more than one hour.
