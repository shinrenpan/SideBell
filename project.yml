name: SideBell

options:
  bundleIdPrefix: com.shinrenpan
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # 開發語言即 fallback 語言：裝置語言不在支援清單時顯示的就是它。
  # 設 en 而非 zh-Hant 的決定性理由是 Shipaton 評審——國際比賽的評審多半
  # 用英文裝置，而 Peace Prize 評的是產品使命，他們得先看懂才能評。
  # 字串本地化本身屬 W4（spec 第 7 節），此處只定 fallback。
  developmentLanguage: en
  groupSortPosition: top

packages:
  # 專案的**第一個也是唯一一個**第三方依賴。引入的理由是 Shipaton 的參賽
  # 要求（以 RevenueCat SDK 驅動至少一項 IAP），而不是技術上需要它。
  # 影響以「型別不得洩漏出 Sources/Core/Sponsorship/」圈住，日後要換掉時
  # 改動範圍明確。
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.83.1"

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6.2+ Approachable Concurrency：模組預設 MainActor 隔離。
    # 傳輸層與 ViewModel 幾乎全在主 actor 上，逐檔標注只是雜訊。
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    DEVELOPMENT_TEAM: "VZWPMD258L"
    CODE_SIGN_STYLE: Automatic

targets:
  SideBell:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: RevenueCat
        product: RevenueCat
    # API key 由 xcconfig 注入，不寫進版控中的原始碼。缺檔時建置仍會成功，
    # 只是 key 為空——見 `Config/Secrets.example.xcconfig`。
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_NAME: SideBell
        PRODUCT_BUNDLE_IDENTIFIER: com.shinrenpan.sidebell
        INFOPLIST_FILE: Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        # 1 = iPhone、2 = iPad。患者端眼控場景以 iPad 為主，
        # 照顧者端與觸控患者場景為 iPhone，兩者都必須支援。
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        # build 號每次上傳都要遞增，重複會被 App Store Connect 拒收。
        # 1、2 已於 2026-08-14 上傳：1 不含警報修復，2 缺 PrivacyInfo.xcprivacy。
        CURRENT_PROJECT_VERSION: "3"
        # App 圖示。`Info.plist` 的 `CFBundleIconName` 引用這個值——
        # 自訂 Info.plist 的專案不會自動注入該鍵，缺了它上傳會被
        # App Store Connect 以 90713 擋下。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"
        # 讓編譯器擷取可本地化字串，產出 `.stringsdata` 供 String Catalog 同步。
        # 沒開就只有舊的來源解析器在跑，而它只認得 `Text("字面值")`——
        # `Button`／`Label`／`Section`／`String(localized:)` 全部看不到，
        # 活著的字串會被整批標成 stale，照著清理就會刪掉真正在用的翻譯。
        SWIFT_EMIT_LOC_STRINGS: "YES"

  SideBellTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SideBell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinrenpan.sidebell.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  SideBell:
    build:
      targets:
        SideBell: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SideBellTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
